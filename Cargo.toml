# AIEN Rig workspace.
#
# The root workspace holds the app. tuner/, creator/ and speech/ are built by
# their own streams as self-contained crates with their own Cargo.lock (tuner
# and speech declare their own [workspace]), so they are excluded here and
# built with --manifest-path. Excluding a folder that does not exist yet is
# fine, so every branch builds whether or not the others are merged.
# tools/crates.py lists what is present; CI builds each one.
[workspace]
resolver = "2"
members = ["app"]
exclude = ["tuner", "creator", "speech"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
