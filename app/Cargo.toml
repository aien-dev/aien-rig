[package]
name = "aien-rig"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "AIEN Rig: one Windows program with a local web page for the tuner, the YouTube helper and chat."
repository = "https://github.com/aien-dev/aien-rig"
publish = false

[[bin]]
name = "aien-rig"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
